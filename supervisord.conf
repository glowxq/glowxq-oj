; ============================================================
; GlowXQ OJ - Supervisord 进程管理配置
; 管理 MySQL + Redis + Nginx + MinIO + go-judge + Spring Boot
; ============================================================

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ─── MySQL (数据库) ───
[program:mysql]
command=mysqld --user=mysql --datadir=/data/mysql --bind-address=127.0.0.1 --port=3306 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password --max-connections=200 --innodb-buffer-pool-size=128M --skip-host-cache
priority=5
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ─── Redis (缓存) ───
[program:redis]
command=redis-server --bind 127.0.0.1 --port 6379 --requirepass %(ENV_REDIS_PASSWORD)s --appendonly yes --dir /data/redis --maxmemory 128mb --maxmemory-policy allkeys-lru
priority=6
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ─── Nginx (前端静态文件 + API 反代) ───
[program:nginx]
command=nginx -g "daemon off;"
priority=10
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ─── MinIO (文件存储) ───
[program:minio]
command=/usr/local/bin/minio server /data/minio --console-address ":9001"
priority=20
autostart=true
autorestart=true
environment=MINIO_ROOT_USER="%(ENV_OSS_ACCESS_KEY)s",MINIO_ROOT_PASSWORD="%(ENV_OSS_SECRET_KEY)s"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ─── go-judge (代码沙盒) ───
[program:go-judge]
command=/bin/bash -c 'ARCH=$(arch); FILE="Sandbox-amd64"; if [[ "$ARCH" =~ "aarch64" ]]; then FILE="Sandbox-arm64"; fi; exec /judge/server/$FILE --silent=true --file-timeout=5m'
directory=/judge/server
priority=30
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ─── Spring Boot (后端 API) ───
; 等待 MySQL + Redis 就绪后再启动
[program:app]
command=/bin/bash -c 'echo "[app] Waiting for MySQL..."; while ! mysqladmin ping -h 127.0.0.1 -u root -p"%(ENV_MYSQL_ROOT_PASSWORD)s" --silent 2>/dev/null; do sleep 1; done; echo "[app] Waiting for Redis..."; while ! redis-cli -h 127.0.0.1 -a "%(ENV_REDIS_PASSWORD)s" ping 2>/dev/null | grep -q PONG; do sleep 1; done; echo "[app] All dependencies ready, starting Spring Boot..."; exec java %(ENV_JAVA_OPTS)s -Djava.security.egd=file:/dev/./urandom -jar /judge/server/app.jar --spring.profiles.active=%(ENV_SPRING_PROFILES_ACTIVE)s'
directory=/judge/server
priority=40
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
