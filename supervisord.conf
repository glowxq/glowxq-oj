; ============================================================
; GlowXQ OJ - Supervisord 进程管理配置
; 管理 Nginx + MinIO + go-judge + Spring Boot
; ============================================================

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

; ─── Nginx (前端静态文件 + API 反代) ───
[program:nginx]
command=nginx -g "daemon off;"
priority=10
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ─── MinIO (文件存储) ───
[program:minio]
command=/usr/local/bin/minio server /data/minio --console-address ":9001"
priority=20
autostart=true
autorestart=true
environment=MINIO_ROOT_USER="%(ENV_OSS_ACCESS_KEY)s",MINIO_ROOT_PASSWORD="%(ENV_OSS_SECRET_KEY)s"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ─── go-judge (代码沙盒) ───
[program:go-judge]
command=/bin/bash -c 'ARCH=$(arch); FILE="Sandbox-amd64"; if [[ "$ARCH" =~ "aarch64" ]]; then FILE="Sandbox-arm64"; fi; exec /judge/server/$FILE --silent=true --file-timeout=5m'
directory=/judge/server
priority=30
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ─── Spring Boot (后端 API) ───
[program:app]
command=/bin/bash -c 'sleep 5 && exec java %(ENV_JAVA_OPTS)s -Djava.security.egd=file:/dev/./urandom -jar /judge/server/app.jar --spring.profiles.active=%(ENV_SPRING_PROFILES_ACTIVE)s'
directory=/judge/server
priority=40
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
