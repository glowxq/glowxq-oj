# ============================================================
# GlowXQ OJ - 宿主机 Nginx 反向代理配置示例
#
# 适用场景：宿主机已有 Nginx，通过 HTTPS 反代到 OJ 容器
# 容器部署端口：WEB_PORT（默认 80，可在 .env.allinone 修改）
#
# 使用方式：
#   1. 将此配置放入 /etc/nginx/conf.d/oj.conf
#   2. 修改 server_name、ssl 证书路径、proxy_pass 端口
#   3. nginx -t && nginx -s reload
# ============================================================

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name oj.glowxq.com;
    return 301 https://$host$request_uri;
}

# HTTPS 反向代理到 OJ 容器
server {
    server_name oj.glowxq.com;
    listen 443 ssl;
    http2 on;

    ssl_certificate /my/ssl/glowxq.com/cert.pem;
    ssl_certificate_key /my/ssl/glowxq.com/cert.key;

    location / {
        proxy_pass http://127.0.0.1:7301/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（OJ 在线通知、踢人下线等功能依赖 WebSocket）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # 文件上传大小限制
        client_max_body_size 50m;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
