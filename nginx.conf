    # res.glowxq.com HTTPS配置 - 端口 443 -> 8110
    server {
        # 【必须修改】替换为ECS公网IP或解析到该IP的域名
        server_name res.glowxq.com;
        listen 443 ssl;
        http2 on;
        ssl_certificate /my/ssl/glowxq.com/cert.pem;
        ssl_certificate_key /my/ssl/glowxq.com/cert.key;

        # 动态DNS解析，确保Nginx能感知OSS后端IP变化
        resolver 100.100.2.136 100.100.2.138 valid=60s;

        # 健康检查端点，用于负载均衡或监控系统
        location /health {
            access_log off;
            return 200 "healthy";
        }

        location / {
            # 代理到上游定义的OSS后端
            proxy_pass http://res-glowxq.oss-cn-shenzhen.aliyuncs.com;

            # 关键配置：确保HTTP/1.1协议和长连接生效
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # 关键配置：将Host头设置为OSS的Bucket内网域名，确保签名验证通过
            # 【必须修改】替换为Bucket内网域名
            proxy_set_header Host "res-glowxq.oss-cn-shenzhen-internal.aliyuncs.com";

            # 转发客户端真实IP
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;

            # 设置代理超时时间
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # 允许上传的最大文件大小，0表示不限制。根据业务需求设置
            client_max_body_size 1024m;
        }
    }

# ================================== nexus api配置
    # oj - 端口 7201 -> 7101
    server {
        server_name glowxq.com;
        listen 7201 ssl;
        http2 on;
        ssl_certificate /my/ssl/glowxq.com/cert.pem;
        ssl_certificate_key /my/ssl/glowxq.com/cert.key;

        # WebSocket支持的location块
        location /api/socket {
            proxy_pass http://127.0.0.1:7101/api/socket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_connect_timeout 60s;
            # 禁用缓冲以支持实时通信
            proxy_buffering off;
        }

        # 通用WebSocket支持 - 捕获所有可能的socket路径
        location ~* ^/(socket|ws|websocket) {
            proxy_pass http://127.0.0.1:7101;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_connect_timeout 60s;
            proxy_buffering off;
        }

        location / {
            proxy_pass http://127.0.0.1:7101/;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
        }
        location /health {
            access_log off;
            return 200 "healthy port 7201->7101\n";
            add_header Content-Type text/plain;
        }
    }

