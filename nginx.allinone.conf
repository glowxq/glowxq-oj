# ============================================================
# GlowXQ OJ - All-in-One 容器内 Nginx 配置
# 前端 SPA 静态文件 + API 反代到内部 Spring Boot
# ============================================================

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    access_log  /var/log/nginx/oj.access.log;
    error_log   /var/log/nginx/oj.error.log;

    # 启用 gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # 允许下划线请求头
    underscores_in_headers on;

    # 前端 SPA 静态文件
    location / {
        root   /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        index  index.html;

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # MinIO 文件代理（使 OSS 文件可通过 80 端口访问）
    # 后端生成的文件 URL 为: http://<host>/nexus-oj/public/xxx.png
    # Nginx 将其代理到内部 MinIO :9000
    location /nexus-oj/ {
        proxy_pass http://127.0.0.1:9000/nexus-oj/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # 文件缓存（OSS 文件通常不变）
        expires 30d;
        add_header Cache-Control "public";
    }

    # API 反向代理到内部 Spring Boot (:7101)
    location /api/ {
        proxy_pass http://127.0.0.1:7101/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置（判题可能耗时较长）
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # 文件上传大小限制
        client_max_body_size 50m;
    }

    # 错误页面
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
