<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260">
  <defs>
    <linearGradient id="fbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="720" height="260" rx="12" fill="url(#fbg)"/>

  <!-- Feature 1: Multi-language -->
  <rect x="20" y="20" width="220" height="100" rx="10" fill="none" stroke="#00d2ff" stroke-width="1.5"/>
  <text x="130" y="50" text-anchor="middle" font-size="24">💻</text>
  <text x="130" y="72" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#00d2ff" font-weight="bold">Multi-Language Judge</text>
  <text x="130" y="92" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#8892b0">C++ / Java / Python</text>
  <text x="130" y="107" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#8892b0">Rust / JavaScript</text>

  <!-- Feature 2: Code Game -->
  <rect x="250" y="20" width="220" height="100" rx="10" fill="none" stroke="#7b2ff7" stroke-width="1.5"/>
  <text x="360" y="50" text-anchor="middle" font-size="24">🎮</text>
  <text x="360" y="72" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#c471f5" font-weight="bold">Code Game</text>
  <text x="360" y="92" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#8892b0">Level-based coding challenges</text>
  <text x="360" y="107" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#8892b0">Combat + Puzzle + Map Editor</text>

  <!-- Feature 3: Code Draw -->
  <rect x="480" y="20" width="220" height="100" rx="10" fill="none" stroke="#96c93d" stroke-width="1.5"/>
  <text x="590" y="50" text-anchor="middle" font-size="24">🎨</text>
  <text x="590" y="72" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#96c93d" font-weight="bold">Code Draw</text>
  <text x="590" y="92" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#8892b0">Visual programming canvas</text>
  <text x="590" y="107" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#8892b0">Array / Tree / List visualize</text>

  <!-- Feature 4: Question Types -->
  <rect x="20" y="140" width="220" height="100" rx="10" fill="none" stroke="#ffd200" stroke-width="1.5"/>
  <text x="130" y="170" text-anchor="middle" font-size="24">📝</text>
  <text x="130" y="192" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#ffd200" font-weight="bold">Multi Question Types</text>
  <text x="130" y="212" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#8892b0">Choice / Fill / Code / Essay</text>
  <text x="130" y="227" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#8892b0">Full exam support</text>

  <!-- Feature 5: Docker Deploy -->
  <rect x="250" y="140" width="220" height="100" rx="10" fill="none" stroke="#2496ED" stroke-width="1.5"/>
  <text x="360" y="170" text-anchor="middle" font-size="24">🐳</text>
  <text x="360" y="192" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#2496ED" font-weight="bold">One-Click Deploy</text>
  <text x="360" y="212" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#8892b0">Docker Compose or All-in-One</text>
  <text x="360" y="227" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#8892b0">No Java/Node required</text>

  <!-- Feature 6: Cross-arch -->
  <rect x="480" y="140" width="220" height="100" rx="10" fill="none" stroke="#e53935" stroke-width="1.5"/>
  <text x="590" y="170" text-anchor="middle" font-size="24">🏗️</text>
  <text x="590" y="192" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#e53935" font-weight="bold">Cross Architecture</text>
  <text x="590" y="212" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#8892b0">x86_64 (amd64)</text>
  <text x="590" y="227" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#8892b0">aarch64 (arm64 / Apple M)</text>
</svg>
