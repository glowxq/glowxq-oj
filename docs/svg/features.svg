<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260">
  <defs>
    <linearGradient id="fbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>

  <rect width="720" height="260" rx="14" fill="url(#fbg)"/>

  <!-- Row 1 -->
  <!-- Multi-language Judge -->
  <rect x="20" y="20" width="220" height="100" rx="12" fill="#e94560" opacity="0.08"/>
  <rect x="20" y="20" width="220" height="100" rx="12" fill="none" stroke="#e94560" stroke-width="1.5"/>
  <text x="130" y="50" text-anchor="middle" font-size="22">💻</text>
  <text x="130" y="73" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#e94560" font-weight="bold">Multi-Language Judge</text>
  <text x="130" y="92" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#a0aec0">C++ / Java / Python</text>
  <text x="130" y="107" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#a0aec0">Rust / JavaScript</text>

  <!-- Code Game -->
  <rect x="250" y="20" width="220" height="100" rx="12" fill="#ffa502" opacity="0.08"/>
  <rect x="250" y="20" width="220" height="100" rx="12" fill="none" stroke="#ffa502" stroke-width="1.5"/>
  <text x="360" y="50" text-anchor="middle" font-size="22">🎮</text>
  <text x="360" y="73" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#ffa502" font-weight="bold">Code Game</text>
  <text x="360" y="92" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#a0aec0">Level-based challenges</text>
  <text x="360" y="107" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#a0aec0">Combat + Puzzle + Editor</text>

  <!-- Code Draw -->
  <rect x="480" y="20" width="220" height="100" rx="12" fill="#2ed573" opacity="0.08"/>
  <rect x="480" y="20" width="220" height="100" rx="12" fill="none" stroke="#2ed573" stroke-width="1.5"/>
  <text x="590" y="50" text-anchor="middle" font-size="22">🎨</text>
  <text x="590" y="73" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#2ed573" font-weight="bold">Code Draw</text>
  <text x="590" y="92" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#a0aec0">Visual programming</text>
  <text x="590" y="107" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#a0aec0">Array / Tree / List viz</text>

  <!-- Row 2 -->
  <!-- Multi Question -->
  <rect x="20" y="140" width="220" height="100" rx="12" fill="#5352ed" opacity="0.08"/>
  <rect x="20" y="140" width="220" height="100" rx="12" fill="none" stroke="#5352ed" stroke-width="1.5"/>
  <text x="130" y="170" text-anchor="middle" font-size="22">📝</text>
  <text x="130" y="193" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#5352ed" font-weight="bold">Multi Question Types</text>
  <text x="130" y="212" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#a0aec0">Choice / Fill / Code</text>
  <text x="130" y="227" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#a0aec0">Full exam support</text>

  <!-- Docker Deploy -->
  <rect x="250" y="140" width="220" height="100" rx="12" fill="#1e90ff" opacity="0.08"/>
  <rect x="250" y="140" width="220" height="100" rx="12" fill="none" stroke="#1e90ff" stroke-width="1.5"/>
  <text x="360" y="170" text-anchor="middle" font-size="22">🐳</text>
  <text x="360" y="193" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#1e90ff" font-weight="bold">One-Click Deploy</text>
  <text x="360" y="212" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#a0aec0">Compose or All-in-One</text>
  <text x="360" y="227" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#a0aec0">No Java/Node required</text>

  <!-- Cross-arch -->
  <rect x="480" y="140" width="220" height="100" rx="12" fill="#ff6348" opacity="0.08"/>
  <rect x="480" y="140" width="220" height="100" rx="12" fill="none" stroke="#ff6348" stroke-width="1.5"/>
  <text x="590" y="170" text-anchor="middle" font-size="22">🏗️</text>
  <text x="590" y="193" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#ff6348" font-weight="bold">Cross Architecture</text>
  <text x="590" y="212" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#a0aec0">x86_64 (amd64)</text>
  <text x="590" y="227" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#a0aec0">aarch64 (arm64 / Apple M)</text>
</svg>
