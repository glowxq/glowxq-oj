<svg xmlns="http://www.w3.org/2000/svg" width="800" height="210" viewBox="0 0 800 210">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="40%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="50%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#ffa502"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#ffa502;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e0e0e0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="210" rx="14" fill="url(#bg)"/>

  <!-- Decorative elements -->
  <circle cx="700" cy="35" r="70" fill="#e94560" opacity="0.06"/>
  <circle cx="100" cy="175" r="90" fill="#ffa502" opacity="0.05"/>
  <circle cx="400" cy="105" r="140" fill="#ff6b6b" opacity="0.03"/>

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="42" x2="800" y2="42"/>
    <line x1="0" y1="84" x2="800" y2="84"/>
    <line x1="0" y1="126" x2="800" y2="126"/>
    <line x1="0" y1="168" x2="800" y2="168"/>
    <line x1="160" y1="0" x2="160" y2="210"/>
    <line x1="320" y1="0" x2="320" y2="210"/>
    <line x1="480" y1="0" x2="480" y2="210"/>
    <line x1="640" y1="0" x2="640" y2="210"/>
  </g>

  <!-- Code brackets -->
  <text x="55" y="122" font-family="'Courier New', monospace" font-size="85" fill="url(#accent)" opacity="0.15" font-weight="bold">&lt;</text>
  <text x="700" y="122" font-family="'Courier New', monospace" font-size="85" fill="url(#accent)" opacity="0.15" font-weight="bold">/&gt;</text>

  <!-- Main title -->
  <text x="400" y="88" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="800" fill="url(#textGrad)" letter-spacing="4">GlowXQ OJ</text>

  <!-- Accent underline -->
  <rect x="260" y="100" width="280" height="3.5" rx="2" fill="url(#accent)"/>

  <!-- Subtitle -->
  <text x="400" y="134" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" fill="#a0aec0" letter-spacing="3" font-weight="500">ONLINE JUDGE PLATFORM</text>

  <!-- Language tags -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#718096" letter-spacing="1">
    <text x="400" y="168" text-anchor="middle">C++  ·  Java  ·  Python  ·  Rust  ·  JavaScript</text>
  </g>

  <!-- Bottom gradient line -->
  <rect x="0" y="205" width="800" height="5" rx="0" fill="url(#accent)" opacity="0.8"/>
</svg>
