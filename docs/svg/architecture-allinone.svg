<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420">
  <defs>
    <linearGradient id="abg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="aaccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#ffa502"/>
    </linearGradient>
    <marker id="arrowA" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#a0aec0"/>
    </marker>
  </defs>

  <rect width="680" height="420" rx="14" fill="url(#abg)"/>

  <!-- Title -->
  <text x="340" y="30" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#a0aec0" font-weight="bold" letter-spacing="2">ALL-IN-ONE ARCHITECTURE</text>
  <rect x="200" y="38" width="280" height="2" rx="1" fill="url(#aaccent)" opacity="0.6"/>

  <!-- Browser -->
  <rect x="260" y="52" width="160" height="36" rx="10" fill="none" stroke="#a0aec0" stroke-width="1.5"/>
  <text x="340" y="75" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#e2e8f0">Browser</text>

  <!-- Arrow -->
  <line x1="340" y1="88" x2="340" y2="108" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrowA)"/>

  <!-- Host Nginx optional -->
  <rect x="220" y="108" width="240" height="32" rx="8" fill="none" stroke="#a0aec0" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="340" y="129" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#718096">Host Nginx (443/SSL) — optional</text>

  <!-- Arrow -->
  <line x1="340" y1="140" x2="340" y2="158" stroke="#a0aec0" stroke-width="1.5" marker-end="url(#arrowA)"/>

  <!-- Container box -->
  <rect x="40" y="158" width="600" height="240" rx="12" fill="none" stroke="url(#aaccent)" stroke-width="2"/>
  <rect x="40" y="158" width="600" height="28" rx="12" fill="url(#aaccent)" opacity="0.12"/>
  <text x="340" y="177" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#e94560" font-weight="bold" letter-spacing="1">Docker Container :80  ·  supervisord</text>

  <!-- Row 1: Nginx + Spring Boot + go-judge -->
  <rect x="65" y="200" width="155" height="50" rx="10" fill="#2ed573" opacity="0.08"/>
  <rect x="65" y="200" width="155" height="50" rx="10" fill="none" stroke="#2ed573" stroke-width="1.5"/>
  <text x="142" y="221" text-anchor="middle" font-family="monospace" font-size="13" fill="#2ed573" font-weight="bold">Nginx</text>
  <text x="142" y="240" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#718096">SPA + /api proxy</text>

  <rect x="235" y="200" width="195" height="50" rx="10" fill="#6DB33F" opacity="0.08"/>
  <rect x="235" y="200" width="195" height="50" rx="10" fill="none" stroke="#6DB33F" stroke-width="1.5"/>
  <text x="332" y="221" text-anchor="middle" font-family="monospace" font-size="13" fill="#6DB33F" font-weight="bold">Spring Boot</text>
  <text x="332" y="240" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#718096">API :7101</text>

  <rect x="445" y="200" width="170" height="50" rx="10" fill="#5352ed" opacity="0.08"/>
  <rect x="445" y="200" width="170" height="50" rx="10" fill="none" stroke="#5352ed" stroke-width="1.5"/>
  <text x="530" y="221" text-anchor="middle" font-family="monospace" font-size="13" fill="#5352ed" font-weight="bold">go-judge</text>
  <text x="530" y="240" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#718096">Sandbox :5050</text>

  <!-- Row 2: MySQL + Redis + MinIO -->
  <rect x="65" y="270" width="170" height="50" rx="10" fill="#1e90ff" opacity="0.08"/>
  <rect x="65" y="270" width="170" height="50" rx="10" fill="none" stroke="#1e90ff" stroke-width="1.5"/>
  <text x="150" y="291" text-anchor="middle" font-family="monospace" font-size="13" fill="#1e90ff" font-weight="bold">MySQL 8.0</text>
  <text x="150" y="310" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#718096">:3306 internal</text>

  <rect x="255" y="270" width="170" height="50" rx="10" fill="#e94560" opacity="0.08"/>
  <rect x="255" y="270" width="170" height="50" rx="10" fill="none" stroke="#e94560" stroke-width="1.5"/>
  <text x="340" y="291" text-anchor="middle" font-family="monospace" font-size="13" fill="#e94560" font-weight="bold">Redis 7</text>
  <text x="340" y="310" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#718096">:6379 internal</text>

  <rect x="445" y="270" width="170" height="50" rx="10" fill="#ffa502" opacity="0.08"/>
  <rect x="445" y="270" width="170" height="50" rx="10" fill="none" stroke="#ffa502" stroke-width="1.5"/>
  <text x="530" y="291" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffa502" font-weight="bold">MinIO</text>
  <text x="530" y="310" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#718096">OSS :9000 internal</text>

  <!-- Volume bar -->
  <rect x="65" y="340" width="550" height="42" rx="8" fill="#0f3460" opacity="0.5"/>
  <text x="340" y="359" text-anchor="middle" font-family="monospace" font-size="11" fill="#718096">Docker Volume</text>
  <text x="340" y="375" text-anchor="middle" font-family="monospace" font-size="10" fill="#a0aec0">oj-data:/data (MySQL + Redis + MinIO)  |  oj-judge:/goj (testcases)</text>

  <!-- Footer -->
  <text x="340" y="410" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#718096">Only port 80 exposed  ·  All data persisted via Docker Volumes</text>
</svg>
