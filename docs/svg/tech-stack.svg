<svg xmlns="http://www.w3.org/2000/svg" width="720" height="200" viewBox="0 0 720 200">
  <defs>
    <linearGradient id="tbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>

  <rect width="720" height="200" rx="14" fill="url(#tbg)"/>

  <!-- Row 1: Backend + Frontend -->
  <!-- Java -->
  <rect x="20" y="20" width="160" height="70" rx="12" fill="#ED8B00" opacity="0.1"/>
  <rect x="20" y="20" width="160" height="70" rx="12" fill="none" stroke="#ED8B00" stroke-width="1.5"/>
  <text x="100" y="50" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="16" fill="#ED8B00" font-weight="bold">Java 21</text>
  <text x="100" y="72" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#a0aec0">Eclipse Temurin</text>

  <!-- Spring Boot -->
  <rect x="195" y="20" width="160" height="70" rx="12" fill="#6DB33F" opacity="0.1"/>
  <rect x="195" y="20" width="160" height="70" rx="12" fill="none" stroke="#6DB33F" stroke-width="1.5"/>
  <text x="275" y="50" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="14" fill="#6DB33F" font-weight="bold">Spring Boot</text>
  <text x="275" y="72" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#a0aec0">3.4 + MyBatis-Flex</text>

  <!-- Vue -->
  <rect x="370" y="20" width="160" height="70" rx="12" fill="#4FC08D" opacity="0.1"/>
  <rect x="370" y="20" width="160" height="70" rx="12" fill="none" stroke="#4FC08D" stroke-width="1.5"/>
  <text x="450" y="50" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="16" fill="#4FC08D" font-weight="bold">Vue 3.5</text>
  <text x="450" y="72" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#a0aec0">Element Plus + TS</text>

  <!-- Vite -->
  <rect x="545" y="20" width="155" height="70" rx="12" fill="#646CFF" opacity="0.1"/>
  <rect x="545" y="20" width="155" height="70" rx="12" fill="none" stroke="#646CFF" stroke-width="1.5"/>
  <text x="622" y="50" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="16" fill="#646CFF" font-weight="bold">Vite 5</text>
  <text x="622" y="72" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#a0aec0">Build Tool</text>

  <!-- Row 2: Infrastructure -->
  <!-- MySQL -->
  <rect x="20" y="110" width="120" height="70" rx="12" fill="#1e90ff" opacity="0.1"/>
  <rect x="20" y="110" width="120" height="70" rx="12" fill="none" stroke="#1e90ff" stroke-width="1.5"/>
  <text x="80" y="142" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="14" fill="#1e90ff" font-weight="bold">MySQL</text>
  <text x="80" y="162" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#a0aec0">8.0</text>

  <!-- Redis -->
  <rect x="155" y="110" width="120" height="70" rx="12" fill="#e94560" opacity="0.1"/>
  <rect x="155" y="110" width="120" height="70" rx="12" fill="none" stroke="#e94560" stroke-width="1.5"/>
  <text x="215" y="142" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="14" fill="#e94560" font-weight="bold">Redis</text>
  <text x="215" y="162" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#a0aec0">7</text>

  <!-- MinIO -->
  <rect x="290" y="110" width="120" height="70" rx="12" fill="#ffa502" opacity="0.1"/>
  <rect x="290" y="110" width="120" height="70" rx="12" fill="none" stroke="#ffa502" stroke-width="1.5"/>
  <text x="350" y="142" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="14" fill="#ffa502" font-weight="bold">MinIO</text>
  <text x="350" y="162" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#a0aec0">Object Storage</text>

  <!-- Docker -->
  <rect x="425" y="110" width="120" height="70" rx="12" fill="#2496ED" opacity="0.1"/>
  <rect x="425" y="110" width="120" height="70" rx="12" fill="none" stroke="#2496ED" stroke-width="1.5"/>
  <text x="485" y="142" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="14" fill="#2496ED" font-weight="bold">Docker</text>
  <text x="485" y="162" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#a0aec0">Multi-stage</text>

  <!-- go-judge -->
  <rect x="560" y="110" width="140" height="70" rx="12" fill="#2ed573" opacity="0.1"/>
  <rect x="560" y="110" width="140" height="70" rx="12" fill="none" stroke="#2ed573" stroke-width="1.5"/>
  <text x="630" y="142" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="14" fill="#2ed573" font-weight="bold">go-judge</text>
  <text x="630" y="162" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#a0aec0">Sandbox</text>
</svg>
