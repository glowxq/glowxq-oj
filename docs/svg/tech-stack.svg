<svg xmlns="http://www.w3.org/2000/svg" width="720" height="200" viewBox="0 0 720 200">
  <defs>
    <linearGradient id="tbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="720" height="200" rx="12" fill="url(#tbg)"/>

  <!-- Row 1 -->
  <!-- Java -->
  <rect x="20" y="20" width="160" height="70" rx="10" fill="#ED8B00" opacity="0.12"/>
  <rect x="20" y="20" width="160" height="70" rx="10" fill="none" stroke="#ED8B00" stroke-width="1.5"/>
  <text x="100" y="50" text-anchor="middle" font-family="monospace" font-size="16" fill="#ED8B00" font-weight="bold">Java 21</text>
  <text x="100" y="72" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#8892b0">Eclipse Temurin</text>

  <!-- Spring Boot -->
  <rect x="195" y="20" width="160" height="70" rx="10" fill="#6DB33F" opacity="0.12"/>
  <rect x="195" y="20" width="160" height="70" rx="10" fill="none" stroke="#6DB33F" stroke-width="1.5"/>
  <text x="275" y="50" text-anchor="middle" font-family="monospace" font-size="14" fill="#6DB33F" font-weight="bold">Spring Boot</text>
  <text x="275" y="72" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#8892b0">3.4 + MyBatis-Flex</text>

  <!-- Vue -->
  <rect x="370" y="20" width="160" height="70" rx="10" fill="#4FC08D" opacity="0.12"/>
  <rect x="370" y="20" width="160" height="70" rx="10" fill="none" stroke="#4FC08D" stroke-width="1.5"/>
  <text x="450" y="50" text-anchor="middle" font-family="monospace" font-size="16" fill="#4FC08D" font-weight="bold">Vue 3.5</text>
  <text x="450" y="72" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#8892b0">Element Plus + TS</text>

  <!-- Vite -->
  <rect x="545" y="20" width="155" height="70" rx="10" fill="#646CFF" opacity="0.12"/>
  <rect x="545" y="20" width="155" height="70" rx="10" fill="none" stroke="#646CFF" stroke-width="1.5"/>
  <text x="622" y="50" text-anchor="middle" font-family="monospace" font-size="16" fill="#646CFF" font-weight="bold">Vite 5</text>
  <text x="622" y="72" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#8892b0">Build Tool</text>

  <!-- Row 2 -->
  <!-- MySQL -->
  <rect x="20" y="110" width="120" height="70" rx="10" fill="#2196F3" opacity="0.12"/>
  <rect x="20" y="110" width="120" height="70" rx="10" fill="none" stroke="#2196F3" stroke-width="1.5"/>
  <text x="80" y="142" text-anchor="middle" font-family="monospace" font-size="14" fill="#2196F3" font-weight="bold">MySQL</text>
  <text x="80" y="162" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#8892b0">8.0</text>

  <!-- Redis -->
  <rect x="155" y="110" width="120" height="70" rx="10" fill="#e53935" opacity="0.12"/>
  <rect x="155" y="110" width="120" height="70" rx="10" fill="none" stroke="#e53935" stroke-width="1.5"/>
  <text x="215" y="142" text-anchor="middle" font-family="monospace" font-size="14" fill="#e53935" font-weight="bold">Redis</text>
  <text x="215" y="162" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#8892b0">7</text>

  <!-- MinIO -->
  <rect x="290" y="110" width="120" height="70" rx="10" fill="#ffd200" opacity="0.12"/>
  <rect x="290" y="110" width="120" height="70" rx="10" fill="none" stroke="#ffd200" stroke-width="1.5"/>
  <text x="350" y="142" text-anchor="middle" font-family="monospace" font-size="14" fill="#ffd200" font-weight="bold">MinIO</text>
  <text x="350" y="162" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#8892b0">Object Storage</text>

  <!-- Docker -->
  <rect x="425" y="110" width="120" height="70" rx="10" fill="#2496ED" opacity="0.12"/>
  <rect x="425" y="110" width="120" height="70" rx="10" fill="none" stroke="#2496ED" stroke-width="1.5"/>
  <text x="485" y="142" text-anchor="middle" font-family="monospace" font-size="14" fill="#2496ED" font-weight="bold">Docker</text>
  <text x="485" y="162" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#8892b0">Multi-stage</text>

  <!-- go-judge -->
  <rect x="560" y="110" width="140" height="70" rx="10" fill="#c471f5" opacity="0.12"/>
  <rect x="560" y="110" width="140" height="70" rx="10" fill="none" stroke="#c471f5" stroke-width="1.5"/>
  <text x="630" y="142" text-anchor="middle" font-family="monospace" font-size="14" fill="#c471f5" font-weight="bold">go-judge</text>
  <text x="630" y="162" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#8892b0">Sandbox</text>
</svg>
