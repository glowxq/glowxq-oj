<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380">
  <defs>
    <linearGradient id="cbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <linearGradient id="caccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d2ff"/>
      <stop offset="100%" style="stop-color:#7b2ff7"/>
    </linearGradient>
    <marker id="arrowC" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#a8b2d1"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="680" height="380" rx="12" fill="url(#cbg)"/>

  <!-- Title -->
  <text x="340" y="30" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#a8b2d1" font-weight="bold" letter-spacing="2">DOCKER COMPOSE ARCHITECTURE</text>
  <rect x="200" y="38" width="280" height="2" rx="1" fill="url(#caccent)" opacity="0.5"/>

  <!-- Browser -->
  <rect x="260" y="52" width="160" height="36" rx="8" fill="none" stroke="#a8b2d1" stroke-width="1.5"/>
  <text x="340" y="75" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#ccd6f6">Browser</text>

  <!-- Arrow -->
  <line x1="340" y1="88" x2="340" y2="115" stroke="#a8b2d1" stroke-width="1.5" marker-end="url(#arrowC)"/>

  <!-- oj-web (Nginx) -->
  <rect x="230" y="115" width="220" height="44" rx="8" fill="none" stroke="#96c93d" stroke-width="1.5"/>
  <rect x="230" y="115" width="220" height="44" rx="8" fill="#96c93d" opacity="0.1"/>
  <text x="340" y="135" text-anchor="middle" font-family="monospace" font-size="13" fill="#96c93d" font-weight="bold">oj-web (Nginx)</text>
  <text x="340" y="151" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#8892b0">:80  SPA + /api proxy</text>

  <!-- Arrow -->
  <line x1="340" y1="159" x2="340" y2="185" stroke="#a8b2d1" stroke-width="1.5" marker-end="url(#arrowC)"/>
  <text x="355" y="176" font-family="monospace" font-size="9" fill="#8892b0">/api/*</text>

  <!-- oj-api -->
  <rect x="200" y="185" width="280" height="50" rx="8" fill="none" stroke="#6DB33F" stroke-width="1.5"/>
  <rect x="200" y="185" width="280" height="50" rx="8" fill="#6DB33F" opacity="0.1"/>
  <text x="340" y="207" text-anchor="middle" font-family="monospace" font-size="13" fill="#6DB33F" font-weight="bold">oj-api (Spring Boot)</text>
  <text x="340" y="225" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#8892b0">:7101 API  +  go-judge :5050</text>

  <!-- Arrows to DB layer -->
  <line x1="270" y1="235" x2="150" y2="280" stroke="#a8b2d1" stroke-width="1" marker-end="url(#arrowC)"/>
  <line x1="340" y1="235" x2="340" y2="280" stroke="#a8b2d1" stroke-width="1" marker-end="url(#arrowC)"/>
  <line x1="410" y1="235" x2="530" y2="280" stroke="#a8b2d1" stroke-width="1" marker-end="url(#arrowC)"/>

  <!-- MySQL -->
  <rect x="65" y="280" width="170" height="50" rx="8" fill="none" stroke="#2196F3" stroke-width="1.5"/>
  <rect x="65" y="280" width="170" height="50" rx="8" fill="#2196F3" opacity="0.1"/>
  <text x="150" y="301" text-anchor="middle" font-family="monospace" font-size="13" fill="#2196F3" font-weight="bold">oj-mysql</text>
  <text x="150" y="320" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#8892b0">MySQL :3306</text>

  <!-- Redis -->
  <rect x="255" y="280" width="170" height="50" rx="8" fill="none" stroke="#e53935" stroke-width="1.5"/>
  <rect x="255" y="280" width="170" height="50" rx="8" fill="#e53935" opacity="0.1"/>
  <text x="340" y="301" text-anchor="middle" font-family="monospace" font-size="13" fill="#e53935" font-weight="bold">oj-redis</text>
  <text x="340" y="320" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#8892b0">Redis :6379</text>

  <!-- MinIO -->
  <rect x="445" y="280" width="170" height="50" rx="8" fill="none" stroke="#ffd200" stroke-width="1.5"/>
  <rect x="445" y="280" width="170" height="50" rx="8" fill="#ffd200" opacity="0.1"/>
  <text x="530" y="301" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffd200" font-weight="bold">oj-minio</text>
  <text x="530" y="320" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#8892b0">MinIO :9000</text>

  <!-- Footer -->
  <text x="340" y="365" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#8892b0">5 containers  ·  docker compose up -d  ·  All services isolated</text>
</svg>
