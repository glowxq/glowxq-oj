# ============================================================
# GlowXQ OJ - 全栈 Docker Compose 编排
# 包含：MySQL + Redis + MinIO + 后端 API + 前端 Nginx
#
# 使用方式:
#   全栈部署:  ./deploy.sh
#   开发模式:  ./deploy.sh dev  (仅启动基础设施)
#   更新重建:  ./deploy.sh update
# ============================================================

services:
  # ==================== MySQL 8.0 ====================
  mysql:
    image: mysql:8.0
    container_name: oj-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-glowxq123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-glowxq_oj}
      TZ: Asia/Shanghai
    volumes:
      - ${DATA_DIR:-./data}/mysql:/var/lib/mysql
      - ./glowxq-api/script/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --max_connections=200
      --innodb_buffer_pool_size=256M
      --innodb_log_file_size=64M
      --slow_query_log=1
      --long_query_time=2
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-glowxq123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - oj-network

  # ==================== Redis 7 ====================
  redis:
    image: redis:7-alpine
    container_name: oj-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-glowxq123456}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - ${DATA_DIR:-./data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-glowxq123456}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - oj-network

  # ==================== MinIO 对象存储 ====================
  minio:
    image: minio/minio:latest
    container_name: oj-minio
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - ${DATA_DIR:-./data}/minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - oj-network

  # ==================== MinIO 初始化（自动创建 Bucket）====================
  minio-init:
    image: minio/mc
    container_name: oj-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set oj-minio http://minio:9000 $${MINIO_ACCESS_KEY:-minioadmin} $${MINIO_SECRET_KEY:-minioadmin};
      mc mb --ignore-existing oj-minio/$${MINIO_BUCKET:-nexus-oj};
      mc anonymous set download oj-minio/$${MINIO_BUCKET:-nexus-oj};
      echo 'MinIO bucket initialized successfully!';
      exit 0;
      "
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-nexus-oj}
    networks:
      - oj-network

  # ==================== 后端 API (Spring Boot + go-judge) ====================
  oj-api:
    build:
      context: ./glowxq-api
      dockerfile: app/app-oj/Dockerfile
    container_name: oj-api
    restart: unless-stopped
    privileged: true
    shm_size: 512m
    ports:
      - "${APP_PORT:-7101}:7101"
      - "${SANDBOX_PORT:-5050}:5050"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # MySQL
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-glowxq_oj}
      MYSQL_USER: root
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-glowxq123456}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-glowxq123456}
      REDIS_DATABASE: ${REDIS_DATABASE:-1}
      # MinIO (容器内使用 Docker 网络)
      OSS_ENDPOINT: http://minio:9000
      # OSS_DOMAIN: 文件 URL 的域名前缀，通过前端 Nginx /nexus-oj/ 代理访问
      # 本地默认 http://localhost，生产设置 SITE_URL 为公网域名
      OSS_DOMAIN: ${SITE_URL:-http://localhost}
      OSS_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      OSS_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      # JWT
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your_secret_key_please_change_me}
      # JVM
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m}
      # 飞书集成（可选）
      FEISHU_INTERNAL_WEBHOOK: ${FEISHU_INTERNAL_WEBHOOK:-}
      FEISHU_BUSINESS_WEBHOOK: ${FEISHU_BUSINESS_WEBHOOK:-}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7101/api/doc.html || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - oj-network

  # ==================== 前端 Web (Vue 3 + Nginx) ====================
  oj-web:
    build:
      context: ./oj-web
      dockerfile: Dockerfile
      args:
        APP_NAME: oj
    container_name: oj-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./nginx.deploy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - oj-api
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - oj-network

# ==================== 网络 ====================
networks:
  oj-network:
    driver: bridge
